name: Something is wrong
description: A register reads the wrong thing, or nothing works at all
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most reports here turn out to be one of a few things that look identical
        from outside, so the first field asks you to run one command that tells
        all of us which it is.

  - type: textarea
    id: doctor
    attributes:
      label: What the doctor says
      description: |
        Run this from the repository and paste every line, including the ones
        that did not pass. Those are the ones worth reading, so do not trim it.

        macOS and Linux:

            python3 -m snesrtc.doctor

        Windows, whichever of these resolves:

            python -m snesrtc.doctor
            py -3 -m snesrtc.doctor

        It reports the machine as well as the package, so most answers are in
        there already. If it will not run at all, say so here and paste whatever
        it printed instead.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: |
        reading 0x2800 after latching should give the seconds digit, not the index
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened instead
      description: |
        The exact output or the whole traceback. Paste it rather than describing
        it: a summary of an error loses the part that identifies it.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: The shortest thing that shows it
      description: Python we can run as it stands, with no editing.
      render: python
      placeholder: |
        from snesrtc import describe

        clock = describe("s-rtc").build()
        clock.read(0x2800)
    validations:
      required: true

  - type: input
    id: cartridge
    attributes:
      label: The game, if one is involved
      description: |
        Its name and its SHA-256. Never attach the file itself, and never link
        to somewhere it can be downloaded: the digest is what identifies it and
        it is all anybody needs.
      placeholder: "Daikaijuu Monogatari II (Japan), sha256 ..."

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: The doctor output above is complete rather than trimmed
          required: true
        - label: I own anything I am naming, and I have attached none of it
          required: true
