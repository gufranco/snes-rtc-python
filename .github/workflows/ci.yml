name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

      # The workflows are the one thing here nothing else checks, and a mistake
      # in them is only visible once a run has already gone wrong. The archive
      # is verified by digest before anything in it runs.
      - name: Check the workflows themselves
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker
        run: pipx install mypy==1.14.1

      # Strict, with every optional error class the version offers turned on. A
      # model of a clock is arithmetic on masked nibbles end to end, and a checker
      # that sees the whole register file is the cheapest place to catch a width
      # or a None crossing a boundary it should not. The settings live in
      # pyproject.toml so a local run and this one agree.
      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.6.10

      - name: Read the pinned reference commit
        id: pin
        run: |
          commit=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('conformance/pinned.json').read_text())['reference']['commit'])")
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache the reference sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/snes-rtc-reference
          key: reference-${{ steps.pin.outputs.commit }}

      # The tests that compare against the reference are the ones the coverage
      # gate needs, so the driver is built here as well as in the conformance
      # job. Skipping them would leave the gate measuring less than it claims.
      - name: Build the driver the comparison tests need
        run: python conformance/build.py

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find snesrtc conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

  conformance:
    name: Conformance against the reference implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read the pinned reference commit
        id: pin
        run: |
          commit=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('conformance/pinned.json').read_text())['reference']['commit'])")
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache the reference sources
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/snes-rtc-reference
          key: reference-${{ steps.pin.outputs.commit }}

      - name: Build the driver around them
        run: python conformance/build.py

      # A pull request runs a tenth of the scripts for a quick answer. A push to
      # main runs all four hundred, because that is the number the claim of
      # conformance rests on.
      - name: Compare both clocks against the reference
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            runs=40
          else
            runs=400
          fi
          python conformance/reference.py --runs "${runs}" --length 4000
        shell: bash
