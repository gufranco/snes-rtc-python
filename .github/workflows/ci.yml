---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every file Prettier reads is formatted
        run: pnpm run format:check

      - name: Check the workflows themselves
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

      - name: Lint every YAML file
        run: |
          pipx install yamllint==1.38.0
          yamllint --strict .

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

  types:
    name: Types
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker and the build backend's stubs
        run: |
          pipx install mypy==1.14.1
          pipx inject mypy types-setuptools==84.0.0.20260812

      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage and the build backend its tests drive
        run: |
          python -m pip install --disable-pip-version-check \
            coverage==7.6.10 setuptools==84.0.0

      - name: Read the pinned reference commit
        id: pin
        run: |
          commit=$(python - <<'PY'
          import json
          import pathlib
          held = json.loads(pathlib.Path("conformance/pinned.json").read_text())
          print(held["reference"]["commit"])
          PY
          )
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache the reference sources
        uses: actions/cache@v6
        with:
          path: external/snes9x
          key: reference-${{ steps.pin.outputs.commit }}

      - name: Build the driver the comparison tests need
        run: python -m conformance.build

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find snesrtc conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

      - name: The cartridge still writes the bits the record cites
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          sys.path.insert(0, 'conformance')
          from conformance import cartridge
          found = cartridge.recorded()
          assert found, 'the reading is missing from the tree'
          bits = [bit for one in found['controls'] for bit in one['bits']]
          for wanted in ('HOLD', 'CAL_HW'):
              assert wanted in bits, wanted
          count = len(found['controls'])
          print(f"  {count} control writes read from the cartridge: {' '.join(bits)}")
          PY
        shell: bash

      - name: Every quoted sentence, against the document it came from
        run: python -m conformance.quotes

  speed:
    name: Throughput
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The slower clock must still answer faster than the floor
        run: python -m conformance.speed

  conformance:
    name: Conformance against the reference implementations
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read the pinned reference commit
        id: pin
        run: |
          commit=$(python - <<'PY'
          import json
          import pathlib
          held = json.loads(pathlib.Path("conformance/pinned.json").read_text())
          print(held["reference"]["commit"])
          PY
          )
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache the reference sources
        id: cache
        uses: actions/cache@v6
        with:
          path: external/snes9x
          key: reference-${{ steps.pin.outputs.commit }}

      - name: Build the driver around them
        run: python -m conformance.build

      - name: Compare both clocks against the reference
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            runs=40
          else
            runs=400
          fi
          python -m conformance.reference --runs "${runs}" --length 4000
        shell: bash

  package:
    name: package
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Every module ships and no test does
        run: python -m conformance.package dist/snesrtc-*.whl
